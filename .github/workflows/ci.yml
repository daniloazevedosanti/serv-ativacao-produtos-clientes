name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, testes e imagem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unitários + slices (surefire) e integração com Testcontainers (failsafe).
      # O runner do GitHub já tem Docker, que o Testcontainers usa para subir o PostgreSQL.
      - name: Build e testes
        run: ./mvnw -B verify

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      - name: Build da imagem Docker
        run: docker build -t activation-service:${{ github.sha }} .

      # Próximos passos de um pipeline real (CD): scan da imagem (ex.: Trivy), push para o
      # registry (ECR/ACR/GHCR) com a tag do commit e deploy por ambiente com aprovação.
